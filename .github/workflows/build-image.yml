name: Build Golden Fixture Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish healthy fixture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Record build start
        id: clock
        shell: bash
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fixture image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shaikmuhammadsami/topoai-golden-fixture:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            topo.eval.fixture-state=healthy

      - name: Create sanitized provider receipt
        shell: bash
        env:
          BUILD_STARTED_AT: ${{ steps.clock.outputs.started_at }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          RECEIPT_PATH: ${{ runner.temp }}/provider-build-receipt.json
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          digest = os.environ["IMAGE_DIGEST"].strip().lower()
          if re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("Build output did not provide an immutable sha256 digest.")

          repository = "ghcr.io/shaikmuhammadsami/topoai-golden-fixture"
          receipt = {
              "schema_version": "topoai-golden-provider-build-receipt-v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": os.environ["GITHUB_WORKFLOW"],
              "workflow_file": ".github/workflows/build-image.yml",
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "source_commit": os.environ["GITHUB_SHA"].lower(),
              "source_ref": os.environ["GITHUB_REF"],
              "image_repository": repository,
              "image_digest": digest,
              "image_uri_by_digest": f"{repository}@{digest}",
              "base_image_digest": "sha256:b7f3d86d6e84fc17718c48bcde1450807faa2d56704205c697b4bd5df7b9e29f",
              "build_started_or_observed_utc": os.environ["BUILD_STARTED_AT"],
              "build_completed_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          Path(os.environ["RECEIPT_PATH"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload provider receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provider-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/provider-build-receipt.json
          if-no-files-found: error
          retention-days: 30
